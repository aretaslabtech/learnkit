[workspace]
resolver = "2"
members = [
    "crates/learnkit-cli",
    "crates/learnkit-core",
    "crates/learnkit-store",
    "crates/learnkit-profile",
    "crates/learnkit-agent",
    "crates/learnkit-workflow",
    "crates/learnkit-transcription",
    "crates/learnkit-cards",
    "crates/learnkit-media",
    "crates/learnkit-anki",
    "crates/learnkit-assessment",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
is-terminal = "0.4"
dialoguer = "0.11"
tempfile = "3"
reqwest = { version = "0.12", features = ["json", "blocking"] }
rusqlite = { version = "0.31", features = ["bundled"] }
zip = "0.6"
walkdir = "2"

learnkit-core = { path = "crates/learnkit-core" }
learnkit-store = { path = "crates/learnkit-store" }
learnkit-profile = { path = "crates/learnkit-profile" }
learnkit-agent = { path = "crates/learnkit-agent" }
learnkit-workflow = { path = "crates/learnkit-workflow" }
learnkit-transcription = { path = "crates/learnkit-transcription" }
learnkit-cards = { path = "crates/learnkit-cards" }
learnkit-media = { path = "crates/learnkit-media" }
learnkit-anki = { path = "crates/learnkit-anki" }
learnkit-assessment = { path = "crates/learnkit-assessment" }
